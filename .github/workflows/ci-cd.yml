
name: Student Registration CI Pipeline

# Run pipeline whenever code is pushed to main
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
      # Step 1: Get project code from GitHub
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Configure Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Step 3: Configure Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: CMS_AIIMS/pom.xml

    
      - name: Install frontend dependencies
        working-directory: frontend
        shell: cmd
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        shell: cmd
        run: npm run build

      - name: Test and build Spring Boot backend
        working-directory: CMS_AIIMS
        shell: cmd
        run: .\mvnw.cmd -B clean verify

      - name: Deploy frontend
        shell: cmd
        run: |
          if not exist C:\student-registration-deploy\frontend mkdir C:\student-registration-deploy\frontend
          xcopy /E /I /Y frontend\dist C:\student-registration-deploy\frontend

      - name: Deploy backend
        shell: cmd
        run: |
          if not exist C:\student-registration-deploy\backend mkdir C:\student-registration-deploy\backend
          copy /Y CMS_AIIMS\target\*.jar C:\student-registration-deploy\backend\

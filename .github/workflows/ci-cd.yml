
name: Student Registration CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      # 1. Download project code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Configure Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 3. Configure Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: CMS_AIIMS/pom.xml

      # 4. Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: frontend
        shell: cmd
        run: npm ci

      # 5. Build frontend
      - name: Build frontend
        working-directory: frontend
        shell: cmd
        run: npm run build

      # 6. Test and build backend
      - name: Test and build backend
        working-directory: CMS_AIIMS
        shell: cmd
        run: .\mvnw.cmd -B clean verify

      # 7. Deploy and restart applications
      # Runs only after all previous steps succeed
      - name: Deploy application locally
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\deploy-local.ps1
